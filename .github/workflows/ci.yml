name: Offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install tested dependency snapshot
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Run offline unit and persistence tests
        run: python -m pytest -q
      - name: Lint, compile, and dependency health
        run: |
          python -m ruff check src app.py tests
          python -m compileall -q src app.py
          python -m pip check
