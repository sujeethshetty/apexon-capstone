name: Offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.11', '3.12', '3.13']
        include:
          - os: macos-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
    env:
      UV_PYTHON: ${{ matrix.python }}
      PYTHON_DOTENV_DISABLED: '1'
      FALLBACK_PROVIDER: none
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.14'
          # Fetch the locked distributions on every run to detect unavailable pins.
          enable-cache: false
      - name: Set up Python
        run: uv python install --no-bin
      - name: Install locked project and development dependencies
        run: uv sync --locked
      - name: Run offline unit and persistence tests
        run: uv run --locked pytest -q
      - name: Lint, compile, and dependency health
        run: |
          uv run --locked ruff check src app.py tests
          uv run --locked python -m compileall -q src app.py
          uv pip check
