[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cp01-enterprise-knowledge-assistant"
version = "1.0.0"
description = "Local, evidence-first multi-agent enterprise RAG capstone"
requires-python = ">=3.11,<3.14"
dependencies = ["chromadb>=1.0,<2", "langgraph>=1.0,<2", "streamlit>=1.45,<2", "httpx[socks]>=0.28,<1", "PyYAML>=6,<7", "python-dotenv>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
cp01 = "cp01.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: downloads a local embedding model and exercises Chroma"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
